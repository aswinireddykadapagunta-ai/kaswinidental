              <div className="p-2 bg-slate-100 flex gap-1 overflow-x-auto no-scrollbar text-[10px]">
                <button onClick={() => handleChatSend("What are your clinic timings?")} className="px-2 py-1 bg-white rounded border">Timings?</button>
                <button onClick={() => handleChatSend("What is consultation fee?")} className="px-2 py-1 bg-white rounded border">Fee?</button>
                <button onClick={() => handleChatSend("Where is clinic?")} className="px-2 py-1 bg-white rounded border">Location?</button>
              </div>
              <div className="p-3 bg-white border-t border-slate-200 flex gap-2">
                <input 
                  type="text" 
                  placeholder="Ask a question..." 
                  value={chatInput} 
                  onChange={(e) => setChatInput(e.target.value)} 
                  onKeyDown={(e) => e.key === 'Enter' && handleChatSend()}
                  className="flex-1 px-3 py-1.5 rounded-xl border text-xs outline-none"
                />
                <button onClick={() => handleChatSend()} className="px-3 py-1.5 bg-[#00A896] text-white font-bold text-xs rounded-xl">Send</button>
              </div>
            </div>
          )}

          {/* MOBILE STICKY BAR */}
          <div className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-slate-200 p-2 grid grid-cols-3 gap-2 text-center text-xs font-bold">
            <a href={`tel:${CLINIC_INFO.contact.phoneClean}`} className="py-2.5 bg-slate-100 rounded-xl text-[#0A2540]">📞 Call</a>
            <a href={`https://wa.me/${CLINIC_INFO.contact.phoneClean}`} target="_blank" className="py-2.5 bg-emerald-50 text-emerald-700 rounded-xl">💬 WhatsApp</a>
            <button onClick={() => openBooking()} className="py-2.5 bg-[#00A896] text-white rounded-xl">📅 Book</button>
          </div>

          {/* APPOINTMENT MODAL */}
          {bookingModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 relative max-h-[90vh] overflow-y-auto">
                <button onClick={() => setBookingModalOpen(false)} className="absolute top-4 right-4 text-slate-400 font-bold">✕</button>
                
                {!formSubmitted ? (
                  <form onSubmit={handleFormSubmit} className="space-y-3">
                    <h3 className="text-xl font-bold text-[#0A2540]">Book an Appointment</h3>
                    <p className="text-xs text-slate-500">Banjara Hills Branch • Consultation Fee ₹300</p>
                    
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Full Name *</label>
                      <input type="text" required value={formData.fullName} onChange={(e) => setFormData({...formData, fullName: e.target.value})} className="w-full px-3 py-2 border rounded-xl text-xs" placeholder="Your Name" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Phone Number *</label>
                      <input type="tel" required value={formData.phone} onChange={(e) => setFormData({...formData, phone: e.target.value})} className="w-full px-3 py-2 border rounded-xl text-xs" placeholder="+91 9876543210" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Preferred Service *</label>
                      <select required value={formData.service} onChange={(e) => setFormData({...formData, service: e.target.value})} className="w-full px-3 py-2 border rounded-xl text-xs bg-white">
                        <option value="">Select Service</option>
                        {SERVICES_LIST.map(s => <option key={s.id} value={s.title}>{s.title}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Preferred Doctor</label>
                      <select value={formData.doctor} onChange={(e) => setFormData({...formData, doctor: e.target.value})} className="w-full px-3 py-2 border rounded-xl text-xs bg-white">
                        <option value="">Any Available Specialist</option>
                        {DOCTORS_LIST.map(d => <option key={d.id} value={d.name}>{d.name}</option>)}
                      </select>
                    </div>
                    <button type="submit" className="w-full py-3 bg-[#00A896] text-white font-bold text-sm rounded-xl">Request Appointment</button>
                  </form>
                ) : (
                  <div className="py-6 text-center space-y-4">
                    <div className="text-3xl">✅</div>
                    <h3 className="text-xl font-bold text-[#0A2540]">Request Received</h3>
                    <p className="text-xs text-slate-700 bg-teal-50 p-4 rounded-xl border border-teal-100 font-medium">
                      “Thank you. Your appointment request has been received. The clinic team will contact you for confirmation.”
                    </p>
                    <button onClick={() => setBookingModalOpen(false)} className="px-6 py-2 bg-[#0A2540] text-white font-bold text-xs rounded-xl">
                      Close
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
